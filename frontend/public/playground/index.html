<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><title>SWAGYSTAN LAB</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px ui-monospace,monospace}header,nav{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid #333}header{padding-top:max(12px,env(safe-area-inset-top));justify-content:space-between}button{font:inherit;color:inherit;background:none;border:1px solid #444;padding:10px;cursor:pointer}button[aria-pressed=true]{background:#eee;color:#111}main{display:grid;grid-template-columns:1fr 1fr;min-height:65dvh}textarea{width:100%;min-height:45dvh;resize:vertical;background:#171717;color:#eee;border:0;padding:16px;font:16px/1.6 ui-monospace,monospace;outline-offset:-2px;tab-size:2}iframe{width:100%;height:100%;min-height:45dvh;border:0;background:white}footer{padding:12px;color:#aaa}@media(max-width:700px){main{grid-template-columns:1fr}iframe{height:40dvh;min-height:0}textarea{min-height:35dvh}}
</style></head><body><header><strong>SWAGYSTAN / LAB</strong><button id="run">RUN</button></header><nav aria-label="Language"><button data-lang="html" aria-pressed="true">HTML</button><button data-lang="css" aria-pressed="false">CSS</button><button data-lang="js" aria-pressed="false">JS</button></nav><main><textarea id="editor" aria-label="Code editor" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea><iframe id="preview" title="Preview" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></main><footer id="status" role="status">LOCAL PLAYGROUND</footer><script>
const key='swagystan-playground-v1';const defaults={html:'<h1>SWAGYSTAN</h1>\n<button>MENS</button>',css:'body { font-family: monospace; }',js:''};let code={...defaults};try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved)for(const k of Object.keys(defaults))if(typeof saved[k]==='string')code[k]=saved[k]}catch{}let active='html';const editor=document.querySelector('#editor'),preview=document.querySelector('#preview'),status=document.querySelector('#status');editor.value=code[active];function save(){code[active]=editor.value;try{localStorage.setItem(key,JSON.stringify(code));status.textContent='SAVED ON THIS DEVICE'}catch{status.textContent='LOCAL STORAGE UNAVAILABLE'}}function run(){save();const css=code.css.replace(/<\/style/gi,'<\\/style');const js=code.js.replace(/<\/script/gi,'<\\/script');preview.srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data: blob:; connect-src \'none\'; form-action \'none\'; base-uri \'none\'"><style>'+css+'</style>'+code.html+'<script>'+js+'<\/script>'}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{save();active=b.dataset.lang;editor.value=code[active];document.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));editor.addEventListener('input',save);document.querySelector('#run').addEventListener('click',run);run();
</script></body></html>
