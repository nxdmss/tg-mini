services:
  postgres:
    image: postgres:16
    container_name: tg-mini-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tgmini

    ports:
      - "5432:5432"

    volumes:
      - tg-mini-postgres-data:/var/lib/postgresql/data

volumes:
  tg-mini-postgres-data: