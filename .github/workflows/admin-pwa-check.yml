name: admin-pwa-check

on:
  pull_request:
    paths:
      - "admin/**"
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/admin-pwa-check.yml"
  push:
    branches:
      - "feature/admin-orders-pwa"
    paths:
      - "admin/**"
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/admin-pwa-check.yml"

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: backend-package-lock
          path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build


  lockfiles:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfiles
        run: |
          cd backend
          npm install --package-lock-only --ignore-scripts
          cd ../frontend
          npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfiles
        run: |
          if git diff --quiet -- backend/package-lock.json frontend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          git commit -m "build: sync npm lockfiles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
